<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="850" viewBox="0 0 1180 850" font-family="Helvetica, Arial, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Diagrama de blocos do hardware do micromouse</title>
<desc>A bateria LiPo 2S passa pela chave geral e pelo medidor INA219. Desse ponto, um ramo de 7,4 V alimenta a ponte H DRV8833 e outro passa pelo regulador MP1584, que fornece 5 V ao ESP32-S3. O microcontrolador se comunica por I2C com tres sensores VL53L1X e com o MPU-6050, comanda a ponte H, que aciona os motores N20 esquerdo e direito, e recebe de volta os sinais dos encoders.</desc>
